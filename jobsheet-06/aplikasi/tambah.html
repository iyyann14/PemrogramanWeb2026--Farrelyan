<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toko Aplikasi Premium | Tambah Aplikasi</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <div class="header-titles">
            <h1>Toko Aplikasi Premium</h1>
            <p>Web Pengelola Data Aplikasi Premium Online</p>
        </div>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Data Aplikasi</a></li>
                <li><a href="tambah.html" class="active">Tambah Aplikasi</a></li>
                <li><a href="../pelanggan/list.html">Data Pelanggan</a></li>
                <li><a href="../pelanggan/tambah.html">Tambah Pelanggan</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Tambah Aplikasi Baru</h2>
            <form id="form-tambah">
                <p>
                    <label for="nama_app">Nama Aplikasi</label><br>
                    <input type="text" id="nama_app" name="nama_app" placeholder="Contoh: KasirKu Pro" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label><br>
                    <select id="kategori" name="kategori">
                        <option value="7 Hari">7 Hari</option>
                        <option value="1 Bulan">1 Bulan</option>
                        <option value="6 Bulan">6 Bulan</option>
                        <option value="1 Tahun">1 Tahun</option>
                        <option value="Seumur Hidup">Seumur Hidup</option>
                    </select>
                </p>
                <p>
                    <label for="harga">Harga (Rp)</label><br>
                    <input type="number" id="harga" name="harga" min="0" placeholder="100000" required>
                </p>
                <p>
                    <label for="deskripsi">Deskripsi Singkat</label><br>
                    <input type="text" id="deskripsi" name="deskripsi" placeholder="Fitur unggulan aplikasi...">
                </p>
                <p>
                    <button type="submit" class="btn-submit">Simpan Aplikasi</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sistem Informasi Penjualan Aplikasi &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>

</html>
