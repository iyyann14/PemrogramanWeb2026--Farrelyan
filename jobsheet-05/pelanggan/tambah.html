<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toko Aplikasi Premium | Tambah Pelanggan</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <div class="header-titles">
            <h1>Toko Aplikasi Premium</h1>
            <p>Web Pengelola Data Pelanggan</p>
        </div>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../aplikasi/list.html">Data Aplikasi</a></li>
                <li><a href="../aplikasi/tambah.html">Tambah Aplikasi</a></li>
                <li><a href="list.html">Data Pelanggan</a></li>
                <li><a href="tambah.html">Tambah Pelanggan</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Registrasi Pelanggan Baru</h2>
            <form id="form-tambah" novalidate>
                <p>
                    <label for="nama">Nama Lengkap</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_anggota">ID Pelanggan</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="alamat">Kota Domisili</label><br>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No. WhatsApp</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Toko Aplikasi Premium &mdash; Jobsheet 5</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>

</html>
