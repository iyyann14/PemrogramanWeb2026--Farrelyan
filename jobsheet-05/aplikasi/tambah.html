<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toko Aplikasi Premium | Tambah Aplikasi</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <div class="header-titles">
            <h1>Toko Aplikasi Premium</h1>
            <p>Web Pengelola Data Aplikasi Premium Online</p>
        </div>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Data Aplikasi</a></li>
                <li><a href="tambah.html">Tambah Aplikasi</a></li>
                <li><a href="../pelanggan/list.html">Data Pelanggan</a></li>
                <li><a href="../pelanggan/tambah.html">Tambah Pelanggan</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Tambah Aplikasi Baru</h2>
            <form id="form-tambah" novalidate>
                <p>
                    <label for="judul">Nama Aplikasi</label><br>
                    <input type="text" id="judul" name="judul" required>
                </p>
                <p>
                    <label for="pengarang">Kategori / Lisensi</label><br>
                    <input type="text" id="pengarang" name="pengarang" required>
                </p>
                <p>
                    <label for="harga">Harga (Rp)</label><br>
                    <input type="number" id="harga" name="harga" min="0" required>
                </p>
                <p>
                    <label for="stok">Stok Akun</label><br>
                    <input type="number" id="stok" name="stok" min="0" required>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Toko Aplikasi Premium &mdash; Jobsheet 5</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>

</html>
