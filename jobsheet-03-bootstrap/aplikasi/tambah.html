<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toko Aplikasi Premium | Tambah Aplikasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header class="navbar navbar-expand-md navbar-dark custom-bg-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">Toko Aplikasi Premium</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Data Aplikasi</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Aplikasi</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pelanggan/list.html">Data Pelanggan</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pelanggan/tambah.html">Tambah Pelanggan</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3 text-custom-purple">Tambah Aplikasi Baru</h2>
                <form>
                    <div class="mb-3">
                        <label for="nama_app" class="form-label fw-semibold">Nama Aplikasi</label>
                        <input type="text" class="form-control" id="nama_app" name="nama_app"
                            placeholder="Contoh: KasirKu Pro" required>
                    </div>
                    <div class="mb-3">
                        <label for="kategori" class="form-label fw-semibold">Kategori</label>
                        <select class="form-select" id="kategori" name="kategori">
                            <option value="7hari">7 Hari</option>
                            <option value="1bulan">1 Bulan</option>
                            <option value="6bulan">6 Bulan</option>
                            <option value="1tahun">1 Tahun</option>
                            <option value="lifetime">Seumur Hidup</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="harga" class="form-label fw-semibold">Harga (Rp)</label>
                        <input type="number" class="form-control" id="harga" name="harga" min="0" placeholder="100000"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="deskripsi" class="form-label fw-semibold">Deskripsi Singkat</label>
                        <input type="text" class="form-control" id="deskripsi" name="deskripsi"
                            placeholder="Fitur unggulan aplikasi...">
                    </div>
                    <button type="submit" class="btn btn-custom text-white">Simpan Aplikasi</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="text-center text-secondary py-3 small custom-bg-dark text-white mt-auto">
        <p class="mb-0">&copy; 2026 Sistem Informasi Penjualan Aplikasi</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
