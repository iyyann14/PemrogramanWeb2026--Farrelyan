<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toko Aplikasi Premium | Tambah Pelanggan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-expand-md navbar-dark custom-bg-dark">
        <div class="container">
            <div class="navbar-brand">
                <a class="text-white text-decoration-none fw-bold fs-4 d-block" href="../index.html">Toko Aplikasi
                    Premium</a>
                <small class="text-white-50 d-none d-md-block" style="font-size: 0.8rem;">Web Pengelola Data
                    Pelanggan</small>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../aplikasi/list.html">Data Aplikasi</a></li>
                    <li class="nav-item"><a class="nav-link" href="../aplikasi/tambah.html">Tambah Aplikasi</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Data Pelanggan</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Pelanggan</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3 text-custom-purple">Registrasi Pelanggan Baru</h2>
                <form>
                    <div class="mb-3">
                        <label for="id_pelanggan" class="form-label fw-semibold">ID Pelanggan</label>
                        <input type="text" class="form-control" id="id_pelanggan" name="id_pelanggan"
                            placeholder="Contoh: CUST-003" required>
                    </div>
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-semibold">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama" name="nama"
                            placeholder="Nama lengkap pelanggan" required>
                    </div>
                    <div class="mb-3">
                        <label for="kota" class="form-label fw-semibold">Kota Domisili</label>
                        <input type="text" class="form-control" id="kota" name="kota" placeholder="Contoh: Jakarta">
                    </div>
                    <div class="mb-3">
                        <label for="no_hp" class="form-label fw-semibold">No. WhatsApp</label>
                        <input type="text" class="form-control" id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx">
                    </div>
                    <button type="submit" class="btn btn-custom text-white">Daftarkan Pelanggan</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="text-center text-secondary py-3 small custom-bg-dark text-white mt-auto">
        <p class="mb-0">&copy; 2026 Sistem Informasi Penjualan Aplikasi</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
