<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toko Aplikasi Premium | Login Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <div class="header-titles">
            <h1>Toko Aplikasi Premium</h1>
            <p>Sistem Pengelola Data (Admin)</p>
        </div>
    </header>
    <main>
        <section>
            <h2>Login Admin</h2>
            <form>
                <p>
                    <label for="username">Username</label><br>
                    <input type="text" id="username" name="username" required>
                </p>
                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required>
                </p>
                <p>
                    <button type="submit">Masuk</button>
                </p>
                <p>
                    Kembali ke <a href="index.html">Beranda</a>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sistem Informasi Penjualan Aplikasi &mdash; Jobsheet 4</p>
    </footer>
</body>

</html>
